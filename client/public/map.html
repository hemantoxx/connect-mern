<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nearby Facilities Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
      }
      #map {
        height: 80vh;
        width: 100%;
      }
      #controls {
        padding: 20px;
        background-color: #f9f9f9;
        box-shadow: 0px 2px 10px rgba(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;
        gap: 15px;
      }
      #controls div {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      #controls input,
      #controls button {
        padding: 8px 12px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
      }
      #controls button {
        background-color: #007bff;
        color: white;
        cursor: pointer;
      }
      #controls button:hover {
        background-color: #0056b3;
      }
    </style>
  </head>
  <body>
    <div id="controls">
      <div>
        <input
          type="text"
          id="cityInput"
          placeholder="Enter city/locality name"
        />
        <button onclick="useCityName()">Search by City/Locality</button>
      </div>
      <div>
        <input
          type="number"
          id="latInput"
          placeholder="Ex: 19.0596"
          step="any"
        />
        <input
          type="number"
          id="lonInput"
          placeholder="Ex: 72.8295"
          step="any"
        />
        <button onclick="useInputCoordinates()">
          Search by Latitude & Longitude
        </button>
      </div>
      <button onclick="locateUser()">Use Current Location</button>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
      const apiKey = "cb17cd5c7fe24c5b983f9abbb0d4d0ca"; // Replace with your OpenCage API key
      let map;
      let facilityMarkers = [];
      let searchCircle;
      const searchRadius = 3000; // 3 km

      // Initialize map
      function initMap(lat, lon) {
        if (map) {
          map.setView([lat, lon], 13);
          return;
        }

        map = L.map("map").setView([lat, lon], 13);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          attribution: "© OpenStreetMap contributors",
          maxZoom: 18,
        }).addTo(map);
      }

      // Add a circle and red marker to the map
      function addCircleAndMarker(lat, lon) {
        // Remove existing circle and markers
        if (searchCircle) {
          map.removeLayer(searchCircle);
        }

        // Add a circle
        searchCircle = L.circle([lat, lon], {
          color: "blue",
          fillColor: "#add8e6",
          fillOpacity: 0.3,
          radius: searchRadius,
        }).addTo(map);

        // Add a red marker for the input location
        L.marker([lat, lon], {
          icon: L.icon({
            iconUrl: "/images/redMark.png", // Use the same red marker icon
            iconSize: [25, 41], // Keep the same marker size
            iconAnchor: [12, 41], // Anchor point
            popupAnchor: [1, -34], // Popup positioning
          }),
        })
          .addTo(map)
          .bindPopup("<b>Selected Location</b>")
          .openPopup();
      }

      // Fetch nearby facilities
      function fetchNearbyFacilities(lat, lon) {
        const overpassUrl = "https://overpass-api.de/api/interpreter";
        const query = `
                [out:json];
                (
                    node["amenity"="hospital"](around:${searchRadius}, ${lat}, ${lon});
                    node["amenity"="school"](around:${searchRadius}, ${lat}, ${lon});
                    node["amenity"="college"](around:${searchRadius}, ${lat}, ${lon});
                    node["leisure"="park"](around:${searchRadius}, ${lat}, ${lon});
                );
                out;
            `;

        fetch(overpassUrl + "?data=" + encodeURIComponent(query))
          .then((response) => response.json())
          .then((data) => {
            // Clear previous markers
            facilityMarkers.forEach((marker) => map.removeLayer(marker));
            facilityMarkers = [];

            // Add new markers for the facilities
            data.elements.forEach((element) => {
              const facilityMarker = L.marker([element.lat, element.lon])
                .addTo(map)
                .bindPopup(
                  `<b>${element.tags.amenity || element.tags.leisure}</b><br>${
                    element.tags.name || "Unknown"
                  }`
                );
              facilityMarkers.push(facilityMarker);
            });
          })
          .catch((err) => console.error("Error fetching facilities:", err));
      }

      // Use city/locality name to find coordinates
      function useCityName() {
        const cityName = document.getElementById("cityInput").value;
        if (!cityName) {
          alert("Please enter a city or locality name.");
          return;
        }

        const geocodingUrl = `https://api.opencagedata.com/geocode/v1/json?q=${encodeURIComponent(
          cityName
        )}&key=${apiKey}`;

        fetch(geocodingUrl)
          .then((response) => response.json())
          .then((data) => {
            if (data.results.length === 0) {
              alert("City/Locality not found. Please try again.");
              return;
            }

            const lat = data.results[0].geometry.lat;
            const lon = data.results[0].geometry.lng;

            initMap(lat, lon);
            addCircleAndMarker(lat, lon);
            fetchNearbyFacilities(lat, lon);
          })
          .catch((err) => console.error("Error fetching coordinates:", err));
      }

      // Use latitude and longitude input
      function useInputCoordinates() {
        const lat = parseFloat(document.getElementById("latInput").value);
        const lon = parseFloat(document.getElementById("lonInput").value);

        if (isNaN(lat) || isNaN(lon)) {
          alert("Please enter valid latitude and longitude.");
          return;
        }

        initMap(lat, lon);
        addCircleAndMarker(lat, lon);
        fetchNearbyFacilities(lat, lon);
      }

      // Locate user with current location
      function locateUser() {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (position) => {
              const lat = position.coords.latitude;
              const lon = position.coords.longitude;

              initMap(lat, lon);
              addCircleAndMarker(lat, lon);
              fetchNearbyFacilities(lat, lon);
            },
            (error) => {
              console.error("Geolocation error:", error.message);
              alert(
                "Unable to fetch your location. Please enable location services."
              );
            }
          );
        } else {
          alert("Geolocation is not supported by your browser.");
        }
      }

      // Default map initialization
      window.onload = function () {
        const defaultLat = 28.6139;
        const defaultLon = 77.209; // New Delhi
        initMap(defaultLat, defaultLon);
        addCircleAndMarker(defaultLat, defaultLon);
        fetchNearbyFacilities(defaultLat, defaultLon);
      };
    </script>
  </body>
</html>
